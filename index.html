<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Premium</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    
    <div class="top-controls">
        <button id="graph-toggle" class="mode-toggle" aria-label="Toggle graph mode" data-tooltip="Calculadora Gráfica">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </button>

        <button id="unit-toggle" class="mode-toggle" aria-label="Toggle unit mode" data-tooltip="Calculadora de Unidades">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" ry="2"/>
                <line x1="6" y1="6" x2="6" y2="10"/>
                <line x1="10" y1="6" x2="10" y2="10"/>
                <line x1="14" y1="6" x2="14" y2="10"/>
                <line x1="18" y1="6" x2="18" y2="10"/>
            </svg>
        </button>

        <button id="mode-toggle" class="mode-toggle" aria-label="Toggle mode" data-tooltip="Cambiar modo Científica / Estándar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                <line x1="8" y1="10" x2="16" y2="10"></line>
                <line x1="8" y1="14" x2="10" y2="14"></line>
                <line x1="14" y1="14" x2="16" y2="14"></line>
                <line x1="8" y1="18" x2="10" y2="18"></line>
                <line x1="14" y1="18" x2="16" y2="18"></line>
            </svg>
        </button>

        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" data-tooltip="Cambiar a tema Claro / Oscuro">
            <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>
    
    <main class="calculator-container">
        <div class="display">
            <div class="unit-controls" id="unit-controls" style="display: none;">
                <select id="unit-category" class="unit-select" style="text-align: center;">
                    <option value="length">📏 Longitud</option>
                    <option value="time">⏱ Tiempo</option>
                    <option value="currency">💱 Monedas</option>
                </select>
                <div class="unit-row">
                    <select id="unit-from" class="unit-select unit-half">
                        <option value="m">Metros</option>
                        <option value="km">Kilómetros</option>
                        <option value="cm">Centímetros</option>
                        <option value="mm">Milímetros</option>
                        <option value="in">Pulgadas</option>
                        <option value="ft">Pies</option>
                    </select>
                    <span class="unit-arrow" id="swap-units-btn" style="cursor: pointer;" title="Intercambiar unidades">⇄</span>
                    <select id="unit-to" class="unit-select unit-half">
                        <option value="m">Metros</option>
                        <option value="km">Kilómetros</option>
                        <option value="cm" selected>Centímetros</option>
                        <option value="mm">Milímetros</option>
                        <option value="in">Pulgadas</option>
                        <option value="ft">Pies</option>
                    </select>
                </div>
                <!-- Currency rate info bar -->
                <div class="currency-info" id="currency-info" style="display:none;">
                    <span id="currency-rate-label">Cargando tasas...</span>
                    <span class="currency-refresh-btn" id="currency-refresh-btn" title="Actualizar tasas">↻</span>
                </div>
            </div>
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
            <div class="converted-output" id="converted-output" style="display: none;">0 cm</div>
        </div>
        <div class="grids-wrapper">
            <div class="scientific-grid" id="scientific-grid">
                <button class="btn btn-operator btn-sci" data-action="sin">sin</button>
                <button class="btn btn-operator btn-sci" data-action="cos">cos</button>
                <button class="btn btn-operator btn-sci" data-action="tan">tan</button>
                
                <button class="btn btn-operator btn-sci" data-action="asin">sin⁻¹</button>
                <button class="btn btn-operator btn-sci" data-action="acos">cos⁻¹</button>
                <button class="btn btn-operator btn-sci" data-action="atan">tan⁻¹</button>
                
                <button class="btn btn-operator btn-sci" data-action="log">log</button>
                <button class="btn btn-operator btn-sci" data-action="ln">ln</button>
                <button class="btn btn-operator btn-sci" data-action="exp">eˣ</button>
                
                <button class="btn btn-operator btn-sci" data-action="sqrt">√</button>
                <button class="btn btn-operator btn-sci" data-action="pow">xʸ</button>
                <button class="btn btn-operator btn-sci" data-action="fact">x!</button>
                
                <button class="btn btn-number btn-sci" data-number="π">π</button>
                <button class="btn btn-number btn-sci" data-number="e">e</button>
                <button class="btn btn-operator btn-sci" data-action="inv">1/x</button>
            </div>
            <div class="buttons-grid">
            <button class="btn btn-action" data-action="clear">AC</button>
            <button class="btn btn-action" data-action="delete">DEL</button>
            <button class="btn btn-operator" data-operator="%">%</button>
            <button class="btn btn-operator" data-operator="÷">÷</button>
            
            <button class="btn btn-number" data-number="7">7</button>
            <button class="btn btn-number" data-number="8">8</button>
            <button class="btn btn-number" data-number="9">9</button>
            <button class="btn btn-operator" data-operator="×">×</button>
            
            <button class="btn btn-number" data-number="4">4</button>
            <button class="btn btn-number" data-number="5">5</button>
            <button class="btn btn-number" data-number="6">6</button>
            <button class="btn btn-operator" data-operator="-">-</button>
            
            <button class="btn btn-number" data-number="1">1</button>
            <button class="btn btn-number" data-number="2">2</button>
            <button class="btn btn-number" data-number="3">3</button>
            <button class="btn btn-operator" data-operator="+">+</button>
            
            <button class="btn btn-number btn-zero" data-number="0">0</button>
            <button class="btn btn-number" data-number=".">.</button>
            <button class="btn btn-equals" data-action="calculate">=</button>
        </div>
        </div>
    </main>

    <!-- ===== GRAPHING CALCULATOR PANEL ===== -->
    <div class="graph-panel" id="graph-panel">
        <div class="graph-header">
            <h2 class="graph-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Calculadora Gráfica
            </h2>
            <button id="graph-close" class="graph-close-btn" title="Cerrar">✕</button>
        </div>

        <div class="graph-layout">
            <!-- Left: Controls -->
            <div class="graph-controls">
                <div class="graph-functions-list" id="graph-functions-list">
                    <!-- Function rows added by JS -->
                </div>
                <button class="graph-add-btn" id="graph-add-fn">+ Añadir función</button>

                <div class="graph-section-title">Rango de Ejes</div>
                <div class="graph-range-row">
                    <div class="graph-range-group">
                        <label>X mín</label>
                        <input type="number" id="x-min" class="graph-input" value="-10">
                    </div>
                    <div class="graph-range-group">
                        <label>X máx</label>
                        <input type="number" id="x-max" class="graph-input" value="10">
                    </div>
                    <div class="graph-range-group">
                        <label>Y mín</label>
                        <input type="number" id="y-min" class="graph-input" value="-10">
                    </div>
                    <div class="graph-range-group">
                        <label>Y máx</label>
                        <input type="number" id="y-max" class="graph-input" value="10">
                    </div>
                </div>

                <div class="graph-options-row">
                    <label class="graph-checkbox-label">
                        <input type="checkbox" id="graph-show-grid" checked> Cuadrícula
                    </label>
                    <label class="graph-checkbox-label">
                        <input type="checkbox" id="graph-show-points"> Puntos clave
                    </label>
                    <label class="graph-checkbox-label">
                        <input type="checkbox" id="graph-show-table"> Tabla de valores
                    </label>
                </div>

                <button class="graph-plot-btn" id="graph-plot-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Graficar
                </button>

                <div class="graph-info-panel" id="graph-info-panel">
                    <!-- Key points info shown here -->
                </div>

                <div class="graph-table-wrap" id="graph-table-wrap" style="display:none;">
                    <div class="graph-section-title">Tabla de Valores</div>
                    <div class="graph-table-scroll">
                        <table class="graph-table" id="graph-table">
                            <thead><tr><th>x</th><th>f(x)</th></tr></thead>
                            <tbody id="graph-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right: Canvas -->
            <div class="graph-canvas-wrap">
                <canvas id="graph-canvas"></canvas>
                <div class="graph-canvas-hint">Usa la rueda del ratón para hacer zoom · Arrastra para desplazarte</div>
            </div>
        </div>
    </div>
    <!-- Graph panel backdrop -->
    <div class="graph-backdrop" id="graph-backdrop"></div>

    <script src="js/script.js"></script>
    <script src="js/grapher.js"></script>
</body>
</html>
